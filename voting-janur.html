<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Karya Janur — HUT RI ke-81</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12262A;
    --bg-deep: #0C1C1F;
    --card: #FBF3DE;
    --card-edge: #E9DBAE;
    --ink: #2A1D10;
    --ink-soft: #6B5A3C;
    --gold: #C89B3C;
    --gold-bright: #E3B94D;
    --cream: #F3EAD3;
    --red: #8B2E2E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1B3A3F 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{max-width:720px;margin:0 auto;}

  .fringe{
    height:14px;
    width:100%;
    margin: 0 auto 22px;
    background:
      linear-gradient(135deg, var(--gold) 25%, transparent 25%) 0 0/16px 16px,
      linear-gradient(225deg, var(--gold) 25%, transparent 25%) 0 0/16px 16px;
    opacity:0.55;
  }

  header{text-align:center; margin-bottom:8px;}
  .eyebrow{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--gold-bright); font-weight:600; margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: clamp(28px, 7vw, 40px);
    line-height:1.08;
    margin: 0 0 10px;
    color: var(--cream);
  }
  h1 em{
    font-style:normal;
    color: var(--gold-bright);
  }
  .sub{
    font-size:14.5px; color:#C9C0A8; max-width:460px; margin:0 auto 26px;
    line-height:1.5;
  }

  .status-pill{
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(200,155,60,0.14);
    border:1px solid rgba(227,185,77,0.35);
    color:var(--gold-bright);
    font-size:12.5px; font-weight:600;
    padding:7px 14px; border-radius:99px;
    margin: 0 auto 24px; width:fit-content;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bright);}
  .status-pill .dot.loading{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px;
  }
  @media (max-width:520px){
    .grid{grid-template-columns: 1fr;}
  }

  .card{
    background: var(--card);
    border-radius: 16px;
    overflow:hidden;
    border: 1px solid var(--card-edge);
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    position:relative;
    transition: transform .25s ease, box-shadow .25s ease;
    display:flex; flex-direction:column;
  }
  .card.leader{
    box-shadow: 0 0 0 2px var(--gold-bright), 0 14px 30px rgba(0,0,0,0.35);
  }
  .photo-frame{
    position:relative; aspect-ratio: 3/4; overflow:hidden;
    background:#0C1C1F;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .crown{
    position:absolute; top:10px; right:10px;
    background: var(--gold-bright);
    color: var(--ink);
    font-size:11px; font-weight:700;
    padding: 4px 9px 4px 8px;
    border-radius:99px;
    display:flex; align-items:center; gap:4px;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }

  .card-body{padding:14px 14px 16px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .kelompok-label{
    font-family:'Fraunces', serif;
    font-weight:600; font-size:19px; color:var(--ink);
  }

  .vote-btn{
    margin-top:auto;
    background: var(--red);
    color: #F6E9DD;
    border:none; border-radius:10px;
    padding:11px 14px;
    font-family:'Work Sans', sans-serif;
    font-weight:600; font-size:14px;
    cursor:pointer;
    transition: background .18s ease, transform .12s ease;
  }
  .vote-btn:hover{background:#9F3737;}
  .vote-btn:active{transform:scale(0.97);}
  .vote-btn:disabled{opacity:0.5; cursor:not-allowed;}

  .bar-outer{
    height:9px; border-radius:99px; background:rgba(42,29,16,0.12);
    overflow:hidden;
  }
  .bar-inner{
    height:100%; border-radius:99px;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    width:0%;
    transition: width .5s ease;
  }
  .result-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--ink-soft); font-weight:600;
  }
  .result-row .pct{color:var(--ink); font-family:'Fraunces', serif; font-weight:700; font-size:16px;}

  .voted-banner{
    text-align:center; font-size:13.5px; color:#C9C0A8; margin: 22px 0 6px;
  }
  .voted-banner b{color:var(--gold-bright);}

  footer{
    text-align:center; margin-top:34px; font-size:11.5px; color:#6E7E7E;
  }

  .loading{
    text-align:center; padding:60px 0; color:#C9C0A8; font-size:14px;
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background: var(--gold-bright); color:var(--ink);
    padding:10px 18px; border-radius:99px; font-weight:600; font-size:13.5px;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    opacity:0; pointer-events:none;
    transition: opacity .3s ease, transform .3s ease;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

async function safeGet(key){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 10000);
    const res = await fetch(`${SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`, {signal: ctrl.signal});
    clearTimeout(t);
    const data = await res.json();
    return data.value || null;
  }catch(e){ console.error('Get error:', e); return null; }
}

async function safeSet(key, value){
  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: `action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`
    });
    const data = await res.json();
    return data.success || false;
  }catch(e){ console.error('Set error:', e); return false; }
}

const appEl = document.getElementById('app');
const dotEl = document.getElementById('statusDot');
const pillTextEl = document.getElementById('statusPillText');
const toastEl = document.getElementById('toast');

let myVote = null;
let votes = {};
let pollTimer = null;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 2200);
}

function setSyncing(loading){
  if(loading){ dotEl.classList.add('loading'); }
  else{ dotEl.classList.remove('loading'); }
}

async function loadVotes(){
  const raw = await safeGet(VOTES_KEY);
  votes = raw ? JSON.parse(raw) : {};
}

function loadMyVote(){
  try{ myVote = localStorage.getItem(LOCAL_VOTE_KEY); }catch(e){ myVote = null; }
}

function totalVotes(){
  return Object.values(votes).reduce((a,b)=> a + (+b||0), 0);
}

function leaderId(){
  let best = null, bestN = -1;
  for(const g of GROUPS){
    const n = +votes[g.id] || 0;
    if(n > bestN){ bestN = n; best = g.id; }
  }
  return totalVotes() > 0 ? best : null;
}

function render(){
  const total = totalVotes();
  pillTextEl.textContent = total === 0 ? 'Belum ada suara masuk' : `${total} suara masuk`;
  const lead = leaderId();

  if(!myVote){
    appEl.innerHTML = `<div class="grid">${GROUPS.map(g => `
      <div class="card" data-id="${g.id}">
        <div class="photo-frame"><img src="${g.img}" alt="${g.name}"></div>
        <div class="card-body">
          <div class="kelompok-label">${g.name}</div>
          <button class="vote-btn" data-vote="${g.id}">Pilih ${g.name}</button>
        </div>
      </div>
    `).join('')}</div>`;

    appEl.querySelectorAll('.vote-btn').forEach(btn => {
      btn.addEventListener('click', () => castVote(btn.getAttribute('data-vote')));
    });
  } else {
    appEl.innerHTML = `
      <div class="voted-banner">Kamu sudah vote untuk <b>${GROUPS.find(g=>g.id===myVote)?.name || ''}</b>. Terima kasih! 🙌</div>
      <div class="grid">${GROUPS.map(g => {
        const n = +votes[g.id] || 0;
        const pct = total > 0 ? Math.round((n/total)*100) : 0;
        const isLeader = lead === g.id && total > 0;
        return `
        <div class="card ${isLeader ? 'leader' : ''}">
          <div class="photo-frame">
            <img src="${g.img}" alt="${g.name}">
            ${isLeader ? `<div class="crown">👑 Unggul</div>` : ''}
          </div>
          <div class="card-body">
            <div class="kelompok-label">${g.name}${g.id===myVote ? ' · pilihanmu' : ''}</div>
            <div class="result-row"><span>${n} suara</span><span class="pct">${pct}%</span></div>
            <div class="bar-outer"><div class="bar-inner" style="width:${pct}%"></div></div>
          </div>
        </div>`;
      }).join('')}</div>
    `;
  }
}

async function castVote(id){
  appEl.querySelectorAll('.vote-btn').forEach(b => b.disabled = true);
  setSyncing(true);
  try{
    await loadVotes(); // ambil angka terbaru dulu biar minim tabrakan
    votes[id] = (+votes[id] || 0) + 1;
    const ok = await safeSet(VOTES_KEY, JSON.stringify(votes));
    if(!ok){ throw new Error('set failed'); }
    try{ localStorage.setItem(LOCAL_VOTE_KEY, id); }catch(e){}
    myVote = id;
    showToast('Suara kamu tersimpan!');
    render();
  }catch(e){
    showToast('Gagal menyimpan suara, coba lagi.');
    appEl.querySelectorAll('.vote-btn').forEach(b => b.disabled = false);
  }finally{
    setSyncing(false);
  }
}

async function init(){
  loadMyVote();
  await loadVotes();
  render();
  setSyncing(false);
  pollTimer = setInterval(async () => {
    setSyncing(true);
    await loadVotes();
    render();
    setSyncing(false);
  }, 6000);
}

init();
</script>
